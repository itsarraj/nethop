[package]
name = "nethop"
version = "0.1.0"
edition = "2021"
description = "Combined ping + traceroute with per-hop jitter/loss statistics over multiple rounds — an mtr alternative"
license = "MIT"
authors = ["Animesh Raj <animesh080808@gmail.com>"]
repository = "https://github.com/itsarraj/nethop"
readme = "README.md"
keywords = ["ping", "traceroute", "mtr", "icmp", "cli"]
categories = ["command-line-utilities"]

[lib]
name = "nethop"
path = "src/lib.rs"

[[bin]]
name = "nethop"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
anyhow = "1"
socket2 = { version = "0.5", features = ["all"] }
